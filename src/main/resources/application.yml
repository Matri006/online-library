spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:library_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 25
  flyway:
    user: ${DB_OWNER_USERNAME:library_owner}
    password: ${DB_OWNER_PASSWORD}
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
library:
  demo-enabled: ${DEMO_ENABLED:true}
  admin-password: ${ADMIN_PASSWORD}
  librarian-password: ${LIBRARIAN_PASSWORD:}
  viewer-password: ${VIEWER_PASSWORD:}
