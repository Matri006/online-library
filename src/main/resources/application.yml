spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:library_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: ${MIGRATIONS_ENABLED:false}
    user: ${DB_OWNER_USERNAME:library_owner}
    password: ${DB_OWNER_PASSWORD:}
  session:
    jdbc:
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:30m}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
server:
  address: ${HOST:0.0.0.0}
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
library:
  demo-enabled: ${DEMO_ENABLED:false}
  admin-password: ${ADMIN_PASSWORD:}
  librarian-password: ${LIBRARIAN_PASSWORD:}
  viewer-password: ${VIEWER_PASSWORD:}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
